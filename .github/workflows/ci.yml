name: CnA Framework CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: PHP ${{ matrix.php }} Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, openssl, mbstring, json, intl, bcmath
          ini-values: session.upload_progress.enabled=0
          coverage: none

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Validate Composer Package
        run: composer validate --strict

      - name: Verify Environment (Doctor)
        run: php cna doctor

      - name: Audit Security Configuration
        run: php cna security:check

      - name: Run Framework Test Suite
        run: php cna test

      - name: Run Micro-Benchmarks
        run: php cna benchmark

