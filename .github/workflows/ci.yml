name: CnA Framework CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, openssl, mbstring, json, intl, bcmath
          ini-values: session.upload_progress.enabled=0
          tools: composer:2.11.2
          coverage: none

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Validate Composer Package
        run: composer validate --strict --no-check-lock

      - name: Composer Security Audit
        run: |
          composer update --no-install
          composer audit

      - name: Verify Environment (Doctor)
        run: php cna doctor

      - name: Audit Security Configuration
        run: php cna security:check

      - name: Framework Deep Security Audit
        run: php cna security:audit

      - name: Run Framework Test Suite
        run: php cna test

      - name: Run Skeleton Architecture Tests
        run: php cna test skeleton/tests

      - name: Setup Node.js Runtime for Frontend Manifest Verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compile Frontend Production Artifacts
        run: |
          npm ci
          npm run build

      - name: Verify Frontend Build & Manifest
        run: php cna frontend:build

      - name: Run Micro-Benchmarks
        run: php cna benchmark

  frontend:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type-Check
        run: npm run type-check

      - name: NPM Security Audit
        run: npm audit --audit-level=high

      - name: Production Vite Build
        run: npm run build
