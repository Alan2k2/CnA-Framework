name: CnA Framework CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@c54fbc0776c34e52e763a096153630442347f27b # v2.32.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, openssl, mbstring, json, intl, bcmath
          ini-values: session.upload_progress.enabled=0
          coverage: none

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Validate Composer Package
        run: composer validate --strict

      - name: Composer Security Audit
        run: composer audit

      - name: Verify Environment (Doctor)
        run: php cna doctor

      - name: Audit Security Configuration
        run: php cna security:check

      - name: Framework Deep Security Audit
        run: php cna security:audit

      - name: Run Framework Test Suite
        run: php cna test

      - name: Run Skeleton Architecture Tests
        run: php cna test skeleton/tests

      - name: Run Micro-Benchmarks
        run: php cna benchmark
